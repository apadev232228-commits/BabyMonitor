<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Anonymous Feedback — Baby Monitor for Parents</title>
    <meta name="description" content="Send anonymous feedback or feature requests directly to the developer of Baby Monitor for Parents. 100% private in-app and web submission without account registration.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://apadev232228-commits.github.io/BabyMonitor/feedback.html">
    <link rel="icon" type="image/png" sizes="192x192" href="./app-icon.png">
    <link rel="apple-touch-icon" href="./app-icon.png">
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --input-bg: #ffffff;
            --success: #16a34a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --primary: #3b82f6;
                --primary-hover: #60a5fa;
                --border: #334155;
                --input-bg: #0f172a;
                --success: #22c55e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .feedback-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        textarea,
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        textarea:focus,
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .status-box {
            display: none;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .status-success {
            background-color: rgba(34, 197, 94, 0.12);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
    </style>
</head>

<body>
    <div class="feedback-card">
        <div class="header">
            <h1>🛡️ Anonymous Feedback</h1>
            <p>Tell us what went wrong or how we can improve. Your submission is 100% private and confidential.</p>
        </div>

        <div id="statusBox" class="status-box"></div>

        <form id="feedbackForm">
            <div class="form-group">
                <label for="message">Feedback or Issue Description *</label>
                <textarea id="message" name="message" required
                    placeholder="Describe what happened, what device was used, or what feature you would love to see..."></textarea>
            </div>

            <div class="form-group">
                <label for="device">Device &amp; Android Version (Optional)</label>
                <div class="hint">Helps us troubleshoot hardware-specific glitches.</div>
                <input type="text" id="device" name="device" placeholder="e.g. Pixel 7 (Android 14) / Web Browser">
            </div>

            <div class="form-group">
                <label for="email">Your Email (Optional)</label>
                <div class="hint">Leave empty to remain 100% anonymous. Only fill if you'd like a personal reply.</div>
                <input type="email" id="email" name="email" placeholder="you@example.com (optional)">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Submit Feedback 🛡️</button>
        </form>

        <div class="footer-links">
            <a href="./index.html">← Back to Baby Monitor Home</a>
        </div>
    </div>

    <script>
        // Shared Google Apps Script Webhook URL (configured by developer)
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzaQ8PWVq55qgLAoPXnW4YOc9vtYbcs6N6jyo368rloQdaSGjum3mNcwioWZN980tM/exec";

        const form = document.getElementById("feedbackForm");
        const btnSubmit = document.getElementById("btnSubmit");
        const statusBox = document.getElementById("statusBox");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const message = document.getElementById("message").value.trim();
            const device = document.getElementById("device").value.trim() || navigator.userAgent;
            const email = document.getElementById("email").value.trim() || "Anonymous";

            if (!message) return;

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Submitting...";
            statusBox.style.display = "none";

            const payload = {
                timestamp: Date.now(),
                source: "Website",
                message: message,
                email: email,
                device: device,
                appVersion: "Web"
            };

            try {
                // Submit to shared webhook
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    mode: "no-cors", // Google Apps Script handles no-cors cleanly
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                statusBox.className = "status-box status-success";
                statusBox.innerHTML = "<strong>Thank you!</strong> Your feedback has been submitted anonymously. 🛡️";
                statusBox.style.display = "block";
                form.reset();
            } catch (err) {
                statusBox.className = "status-box status-error";
                statusBox.innerHTML = "Could not send directly. Please email us at <strong>apadev232228@gmail.com</strong>";
                statusBox.style.display = "block";
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Submit Feedback 🛡️";
            }
        });
    </script>
</body>

</html>
